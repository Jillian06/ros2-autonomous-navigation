name: ROS 2 Gazebo integration demo

on:
  push:
    branches: [demo-validation]
  workflow_dispatch:

jobs:
  gazebo-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS 2 Jazzy repository
        run: |
          curl -fsSL -o /tmp/ros2-apt-source.deb https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.3.0/ros2-apt-source_1.3.0.noble_all.deb
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
      - name: Install ROS, Gazebo, RViz, and recording tools
        run: |
          sudo apt-get install -y --no-install-recommends ros-jazzy-ros-base ros-jazzy-ros-gz-sim ros-jazzy-ros-gz-bridge ros-jazzy-rviz2 python3-colcon-common-extensions python3-matplotlib xvfb ffmpeg
      - name: Run simulation and record measured output
        env:
          DEMO_DURATION: '25'
        run: bash scripts/ci_demo.sh
      - name: Upload unedited run evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazebo-integration-evidence
          path: |
            media/demo_results.json
            media/trajectory.png
            media/gazebo_demo.png
            media/gazebo_demo.gif
            media/launch.log
            media/topics.log
            media/odom_diagnostics.log
          if-no-files-found: warn

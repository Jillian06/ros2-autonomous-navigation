name: core-tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run simulator-independent unit tests
        env:
          PYTHONPATH: autonomous_navigation
        run: pytest -q autonomous_navigation/test/test_planning.py autonomous_navigation/test/test_control.py
